version: 0.1.0
inputs:
  files:
    - code/helloworld.py
    - data/names.txt
  parameters:
    helloworld: code/helloworld.py
    inputfile: data/names.txt
    outputfile: results/greetings.txt
    sleeptime: 5
workflow:
  type: serial
  specification:
    steps:
      - compute_backend: compute4punch
        environment: 'wlcg-wn:latest'
        c4p_notification: Always
        c4p_cpu_cores: "2"
        commands:
          - python3 "${helloworld}" --inputfile "${inputfile}" --outputfile
            "${outputfile}" --sleeptime ${sleeptime}
outputs:
  files:
    - results/greetings.txt
tests:
  files:
    - tests/serial/log-messages.feature
    - tests/serial/run-duration.feature
    - tests/serial/workspace-files.feature
